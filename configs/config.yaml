# CryptoFunk Configuration
# Environment variables override these settings with CRYPTOFUNK_ prefix
# Example: CRYPTOFUNK_TRADING_MODE=live overrides trading.mode

app:
  name: "CryptoFunk"
  version: "0.1.0"
  environment: "development"  # development, staging, production
  log_level: "info"           # debug, info, warn, error

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "${POSTGRES_PASSWORD}"
  database: "cryptofunk"
  ssl_mode: "disable"
  pool_size: 10

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

nats:
  url: "nats://localhost:4222"
  enable_jetstream: true

llm:
  enabled: true  # Enable/disable LLM reasoning (falls back to rule-based)
  gateway: "bifrost"
  endpoint: "http://localhost:8080/v1/chat/completions"
  api_key: "${LLM_API_KEY}"  # Optional for Bifrost, required for direct OpenAI/Anthropic

  # Model Configuration
  primary_model: "claude-sonnet-4-20250514"
  fallback_models:  # Optional: List of fallback models (automatic failover)
    - "gpt-4-turbo"
    - "gpt-3.5-turbo"

  # Request Settings
  temperature: 0.7
  max_tokens: 2000
  timeout: 30000

  # Caching (Bifrost feature)
  enable_caching: true

  # Circuit Breaker Configuration (resilience for model failures)
  circuit_breaker:
    failure_threshold: 5      # Open circuit after N consecutive failures
    success_threshold: 2      # Close circuit after N consecutive successes
    timeout: 60s              # Time before attempting recovery (half-open state)
    time_window: 5m           # Sliding window for failure tracking

# MCP Server Configuration (Hybrid Architecture)
# External and internal MCP servers for market data, analysis, and execution
mcp:
  # External MCP Servers
  external:
    coingecko:
      enabled: true
      name: "CoinGecko MCP"
      url: "https://mcp.api.coingecko.com/mcp"
      transport: "http_streaming"
      description: "76+ market data tools for prices, historical data, trends"
      cache_ttl: 60  # seconds to cache responses in Redis
      rate_limit:
        enabled: true
        requests_per_minute: 100  # Adjust based on your CoinGecko tier
      tools:  # Available tools from CoinGecko MCP
        - "get_price"           # Current cryptocurrency prices
        - "get_market_chart"    # Historical OHLCV data
        - "get_coin_info"       # Coin metadata
        - "get_trending"        # Trending coins
        - "get_top_gainers"     # Top gaining coins
        # Note: Full list of 76+ tools available, configure as needed

  # Internal (Custom) MCP Servers
  internal:
    order_executor:
      enabled: true
      name: "Order Executor"
      command: "./bin/order-executor-server"
      transport: "stdio"
      description: "Execute orders on exchanges (Binance via CCXT)"
      args: []
      env:
        EXCHANGE: "binance"
        MODE: "${TRADING_MODE}"  # paper or live
      tools:
        - "place_market_order"
        - "place_limit_order"
        - "cancel_order"
        - "get_order_status"
        - "get_positions"

    risk_analyzer:
      enabled: true
      name: "Risk Analyzer"
      command: "./bin/risk-analyzer-server"
      transport: "stdio"
      description: "Portfolio risk management and position sizing"
      args: []
      tools:
        - "calculate_position_size"  # Kelly Criterion
        - "calculate_var"            # Value at Risk
        - "check_portfolio_limits"   # Limit enforcement
        - "calculate_sharpe"         # Sharpe ratio
        - "calculate_drawdown"       # Drawdown metrics

    technical_indicators:
      enabled: true
      name: "Technical Indicators"
      command: "./bin/technical-indicators-server"
      transport: "stdio"
      description: "Technical analysis indicators (RSI, MACD, Bollinger, etc.)"
      args: []
      tools:
        - "calculate_rsi"
        - "calculate_macd"
        - "calculate_bollinger_bands"
        - "calculate_ema"
        - "calculate_adx"
        - "detect_patterns"

    market_data:
      enabled: false  # Optional: Use only if you need Binance-specific features
      name: "Market Data (Binance)"
      command: "./bin/market-data-server"
      transport: "stdio"
      description: "Binance-specific market data (optional, CoinGecko covers most use cases)"
      args: []
      note: "Disabled by default - CoinGecko MCP is primary data source"

trading:
  mode: "paper"  # paper or live
  symbols:
    - "BTCUSDT"
    - "ETHUSDT"
  exchange: "binance"
  initial_capital: 10000.0
  max_positions: 3
  default_quantity: 0.01

risk:
  max_position_size: 0.1       # 10% of portfolio
  max_daily_loss: 0.02         # 2% maximum daily loss
  max_drawdown: 0.1            # 10% maximum drawdown
  default_stop_loss: 0.02      # 2% stop loss
  default_take_profit: 0.05    # 5% take profit
  llm_approval_required: true  # Require LLM approval for trades
  min_confidence: 0.7          # Minimum confidence for signals

  # Safety Guard Configuration
  # Live trading protection mechanisms to prevent excessive losses
  # These guards are enforced at the order execution level
  safety_guard:
    enabled: true                      # Enable/disable safety guards (always enable for live trading!)
    max_daily_drawdown: 0.05           # Stop trading if daily loss exceeds 5%
    max_position_size: 0.1             # Maximum single position as 10% of capital
    max_total_exposure: 0.5            # Maximum total exposure as 50% of capital
    max_daily_trades: 50               # Maximum trades per day (0 = unlimited)
    max_consecutive_losses: 3          # Halt after 3 consecutive losses
    cooldown_period: "1h"              # Wait 1 hour after circuit breaker trips
    max_order_value: 10000.0           # Maximum single order value ($10,000)
    min_order_interval: "5s"           # Minimum 5 seconds between orders
    require_confirmation: true         # Require explicit confirmation for large trades
    large_trade_threshold: 0.05        # Orders > 5% of capital are "large trades"

    # Trading Hours Configuration
    # Restrict trading to specific hours of the day
    trading_hours:
      enabled: false                   # Set to true to restrict trading to specific hours
      start: "09:00"                   # Trading window start time (HH:MM format)
      end: "16:00"                     # Trading window end time (HH:MM format)
      timezone: "America/New_York"     # Timezone for trading hours (IANA timezone name)

  # Circuit Breaker Configuration
  # Automatically halt operations when failure thresholds are exceeded
  # Each service type (exchange, llm, database) has independent settings
  circuit_breaker:
    # Exchange Circuit Breaker
    # Protects against exchange API failures and rate limits
    exchange:
      min_requests: 5           # Minimum requests before circuit can trip
      failure_ratio: 0.6        # Trip after 60% failure rate
      open_timeout: "30s"       # Wait 30s before attempting recovery
      half_open_max_reqs: 3     # Test with 3 requests in half-open state
      count_interval: "10s"     # Count failures over 10s window

    # LLM Circuit Breaker
    # Protects against LLM service failures with longer recovery times
    llm:
      min_requests: 3           # Minimum requests before circuit can trip
      failure_ratio: 0.6        # Trip after 60% failure rate
      open_timeout: "60s"       # Wait 60s before attempting recovery (AI services need more time)
      half_open_max_reqs: 2     # Test with 2 requests in half-open state
      count_interval: "10s"     # Count failures over 10s window

    # Database Circuit Breaker
    # Protects against database connection issues with fast recovery
    database:
      min_requests: 10          # Minimum requests before circuit can trip
      failure_ratio: 0.6        # Trip after 60% failure rate
      open_timeout: "15s"       # Wait 15s before attempting recovery (quick recovery for DB)
      half_open_max_reqs: 5     # Test with 5 requests in half-open state
      count_interval: "10s"     # Count failures over 10s window

exchanges:
  binance:
    api_key: "${BINANCE_API_KEY}"
    secret_key: "${BINANCE_API_SECRET}"
    testnet: true
    rate_limit_ms: 100
    fees:
      maker: 0.001           # 0.1% maker fee (Binance standard tier)
      taker: 0.001           # 0.1% taker fee (Binance standard tier)
      base_slippage: 0.0005  # 0.05% base slippage for market orders
      market_impact: 0.0001  # 0.01% market impact per unit quantity
      max_slippage: 0.003    # 0.3% maximum slippage cap
      withdrawal: 0.0        # Withdrawal fees vary by coin (handled separately)

api:
  host: "0.0.0.0"
  port: 8081
  orchestrator_url: "http://localhost:8081"  # URL for orchestrator control endpoints

  # Authentication Configuration
  # API key authentication protects dashboard and decision endpoints
  # To enable:
  #   1. Run migration 009_api_keys.sql (creates api_keys table)
  #   2. Generate API keys: SELECT * FROM create_api_key('My Key', 'admin', '["read:decisions", "write:feedback"]'::jsonb);
  #   3. Set auth.enabled = true
  #   4. Provide API key via X-API-Key header or Authorization: Bearer <key>
  # Note: If auth is enabled but no valid keys exist, all authenticated endpoints will be inaccessible.
  #       Create at least one admin key before enabling authentication.
  auth:
    enabled: true                # Enable API key authentication (default: false for development)
    header_name: "X-API-Key"     # Header name for API key (also supports Authorization: Bearer <key>)
    require_https: true          # Require HTTPS in production (localhost/127.0.0.1 are exempt)

  # CORS Configuration
  # Controls which origins can access the API from browsers
  # Development: localhost origins are automatically allowed for testing
  # Production: When app.environment=production, only HTTPS origins are allowed (HTTP origins are blocked)
  # How it works:
  #   - In development mode: All origins below are allowed (including HTTP localhost)
  #   - In production mode: Only HTTPS origins are allowed; HTTP origins are filtered out
  #   - Add your production frontend domains here before deploying
  allowed_origins:
    # Production domains (add your actual domains here)
    - "https://cryptofunk.example.com"
    - "https://dashboard.cryptofunk.example.com"

    # Development/Testing (automatically blocked in production)
    - "http://localhost:3000"    # Create React App default
    - "http://localhost:5173"    # Vite default
    - "http://localhost:8080"    # API docs/testing

monitoring:
  prometheus_port: 9100
  enable_metrics: true

telegram:
  enabled: false                      # Enable Telegram bot integration
  bot_token: "${TELEGRAM_BOT_TOKEN}"  # Set via environment variable
  webhook_url: ""                     # Optional: for webhook mode (leave empty for polling)
  polling_timeout: 60                 # Polling timeout in seconds
  debug: false                        # Enable debug mode for bot API
  # Notification preferences (defaults for new users)
  default_preferences:
    receive_alerts: true
    receive_trade_notifications: true
    receive_daily_summary: true

# Notification Configuration (Email and Slack)
# Multi-channel notifications for trading events, alerts, and summaries
notifications:
  enabled: true  # Master switch for notifications

  # Email Notification Settings
  # Configure SMTP server to send email alerts
  email:
    enabled: false                            # Enable email notifications (set to true and configure SMTP)
    host: "${SMTP_HOST}"                      # SMTP server host (e.g., smtp.gmail.com, smtp.sendgrid.net)
    port: 587                                 # SMTP port (587 for STARTTLS, 465 for TLS, 25 for plain)
    username: "${SMTP_USERNAME}"              # SMTP username (often your email address)
    password: "${SMTP_PASSWORD}"              # SMTP password or app-specific password
    from_address: "${SMTP_FROM_ADDRESS}"      # Sender email address
    from_name: "CryptoFunk Trading"           # Sender display name
    recipients:                               # Default recipients for alerts
      - "${ALERT_EMAIL_1}"
      - "${ALERT_EMAIL_2}"
    use_tls: false                            # Use TLS from start (port 465)
    use_starttls: true                        # Use STARTTLS upgrade (port 587) - recommended
    skip_verify: false                        # Skip TLS cert verification (dev only - NOT for production)
    auth_required: true                       # Whether SMTP requires authentication
    rate_limit_per_minute: 30                 # Max emails per minute to prevent spam
    retry_attempts: 3                         # Number of retry attempts on failure
    retry_delay_seconds: 5                    # Delay between retries

  # Slack Notification Settings
  # Configure Slack webhook to send alerts to a channel
  slack:
    enabled: false                            # Enable Slack notifications (set to true and configure webhook)
    webhook_url: "${SLACK_WEBHOOK_URL}"       # Slack incoming webhook URL
    channel: ""                               # Optional: Override webhook default channel (e.g., "#trading-alerts")
    username: "CryptoFunk Bot"                # Bot username displayed in Slack
    icon_emoji: ":chart_with_upwards_trend:"  # Bot icon emoji (or use icon_url)
    icon_url: ""                              # Bot icon URL (overrides icon_emoji if set)
    rate_limit_per_minute: 30                 # Max messages per minute
    retry_attempts: 3                         # Number of retry attempts on failure
    retry_delay_seconds: 2                    # Delay between retries
    timeout_seconds: 30                       # HTTP request timeout

  # Event Routing Configuration
  # Configure which events go to which notification channels
  # Channels: "email", "slack" | Priority: "high", "normal"
  events:
    trade_executed:
      enabled: true
      channels: ["email", "slack"]
      priority: "high"
    position_closed:
      enabled: true
      channels: ["slack"]
      priority: "normal"
    safety_guard:
      enabled: true
      channels: ["email", "slack"]
      priority: "high"
    system_error:
      enabled: true
      channels: ["email", "slack"]
      priority: "high"
    daily_summary:
      enabled: true
      channels: ["email"]
      priority: "normal"
    pnl_alert:
      enabled: true
      channels: ["slack"]
      priority: "high"
    circuit_breaker:
      enabled: true
      channels: ["email", "slack"]
      priority: "high"
    consensus_failure:
      enabled: true
      channels: ["slack"]
      priority: "normal"
