apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: cryptofunk
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: 'null'
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: 'null'
