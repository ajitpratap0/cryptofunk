apiVersion: v1
kind: ConfigMap
metadata:
  name: agents-config
  namespace: cryptofunk
data:
  agents.yaml: |
    # CryptoFunk Agent Configuration - Kubernetes override
    # All localhost URLs replaced with K8s service names

    global:
      default_step_interval: "30s"
      default_confidence_threshold: 0.7
      enable_metrics: true

    analysis_agents:
      technical:
        enabled: true
        name: "technical-agent"
        type: "analysis"
        mcp_servers:
          - name: "coingecko"
            type: "sse"
            url: "https://mcp.api.coingecko.com/sse"
            tools:
              - "get_price"
              - "get_market_chart"
          - name: "technical_indicators"
            type: "http"
            url: "http://technical-indicators-server.cryptofunk.svc.cluster.local:8093/mcp"
        step_interval: "30s"
        config:
          indicators:
            rsi:
              period: 14
              overbought: 70
              oversold: 30
            macd:
              fast_period: 12
              slow_period: 26
              signal_period: 9
            bollinger:
              period: 20
              std_dev: 2
            ema:
              periods: [9, 21, 50, 200]
            adx:
              period: 14
              trend_threshold: 25
          lookback_periods:
            short: "1h"
            medium: "4h"
            long: "1d"
          confidence_weights:
            rsi: 0.25
            macd: 0.25
            bollinger: 0.20
            trend: 0.20
            volume: 0.10

      orderbook:
        enabled: true
        name: "orderbook-agent"
        type: "analysis"
        mcp_servers:
          - name: "coingecko"
            type: "sse"
            url: "https://mcp.api.coingecko.com/sse"
            tools:
              - "get_price"
          - name: "market_data"
            type: "http"
            url: "http://market-data-server.cryptofunk.svc.cluster.local:8090/mcp"
        step_interval: "10s"
        config:
          depth_levels: 20
          imbalance_threshold: 0.7
          large_order_threshold: 10000
          min_confidence: 0.6

      sentiment:
        enabled: true
        name: "sentiment-agent"
        type: "analysis"
        mcp_servers:
          - name: "coingecko"
            type: "sse"
            url: "https://mcp.api.coingecko.com/sse"
            tools:
              - "get_trending"
              - "get_coin_info"
        step_interval: "5m"
        config:
          symbol: "bitcoin"
          analysis_interval: "300s"
          news_sources:
            - name: "cryptopanic"
              api_key: "${CRYPTOPANIC_API_KEY}"
              weight: 1.0
              endpoint: "https://cryptopanic.com/api/v1/posts/"
          lookback_hours: 24
          sentiment_threshold: 0.3
          include_fear_greed: true
          fear_greed_endpoint: "https://api.alternative.me/fng/"
          news_weight: 0.6
          fear_greed_weight: 0.4
          min_articles: 5
          source_weights:
            cryptopanic: 1.0
            cointelegraph: 0.9
            coindesk: 0.9
            decrypt: 0.8

    strategy_agents:
      trend:
        enabled: true
        name: "trend-follower"
        type: "strategy"
        mcp_servers:
          - name: "coingecko"
            type: "sse"
            url: "https://mcp.api.coingecko.com/sse"
            tools:
              - "get_price"
              - "get_market_chart"
          - name: "technical_indicators"
            type: "http"
            url: "http://technical-indicators-server.cryptofunk.svc.cluster.local:8093/mcp"
        step_interval: "5m"
        config:
          symbols: ["bitcoin", "ethereum"]
          fast_ema_period: 9
          slow_ema_period: 21
          adx_period: 14
          adx_threshold: 25.0
          lookback_candles: 100
          risk_management:
            stop_loss_pct: 0.02
            take_profit_pct: 0.03
            trailing_stop_pct: 0.015
            use_trailing_stop: true
            min_risk_reward: 2.0
          confidence_threshold: 0.75
          vote_weight: 0.4

      mean_reversion:
        enabled: true
        name: "reversion-agent"
        type: "strategy"
        mcp_servers:
          - name: "coingecko"
            type: "sse"
            url: "https://mcp.api.coingecko.com/sse"
            tools:
              - "get_price"
              - "get_market_chart"
          - name: "technical_indicators"
            type: "http"
            url: "http://technical-indicators-server.cryptofunk.svc.cluster.local:8093/mcp"
        step_interval: "1m"
        config:
          strategy: "mean_reversion"
          entry_conditions:
            rsi_oversold: 30
            bollinger_touch: true
            volume_spike: 1.5
          exit_conditions:
            rsi_neutral: 50
            bollinger_middle: true
            take_profit_pct: 0.03
            stop_loss_pct: 0.02
          confidence_threshold: 0.70
          vote_weight: 0.3

      arbitrage:
        enabled: true
        name: "arbitrage-agent"
        type: "strategy"
        mcp_servers:
          - name: "coingecko"
            type: "sse"
            url: "https://mcp.api.coingecko.com/sse"
            tools:
              - "get_simple_price"
          - name: "market_data"
            type: "http"
            url: "http://market-data-server.cryptofunk.svc.cluster.local:8090/mcp"
        step_interval: "5s"
        config:
          strategy: "arbitrage"
          min_spread: 0.005
          exchanges:
            - "binance"
            - "coinbase"
            - "kraken"
          max_latency_ms: 100
          confidence_threshold: 0.80
          vote_weight: 0.3
          exchange_fees:
            binance:
              maker_fee: 0.001
              taker_fee: 0.001
              withdraw_fee: 0.0005
            coinbase:
              maker_fee: 0.004
              taker_fee: 0.006
              withdraw_fee: 0.001
            kraken:
              maker_fee: 0.0016
              taker_fee: 0.0026
              withdraw_fee: 0.0009

      polymarket:
        enabled: true
        name: "polymarket-agent"
        type: "strategy"
        version: "1.0.0"
        metrics_port: 9109
        mcp_servers:
          - name: "polymarket"
            type: "http"
            url: "http://polymarket-server.cryptofunk.svc.cluster.local:8094/mcp"
        step_interval: "5m"
        config:
          poll_interval: "5m"
          max_position_size: 10.0
          max_total_exposure: 50.0
          confidence_threshold: 0.70
          profit_target: 0.15
          stop_loss: 0.10
          min_liquidity: 1000.0
          preferred_categories:
            - "politics"
            - "crypto"
            - "tech"
            - "news"
          vote_weight: 0.3

    risk_agent:
      enabled: true
      name: "risk-agent"
      type: "risk"
      agent_name: "risk-agent"
      agent_type: "risk"
      weight: 1.0
      nats_url: "nats://nats-service:4222"
      signal_topic: "cryptofunk.agent.signals"
      heartbeat_topic: "cryptofunk.agent.heartbeat"
      decision_topic: "cryptofunk.orchestrator.decisions"
      heartbeat_interval: "30s"
      max_position_size: 10000.0
      max_total_exposure: 50000.0
      max_concentration: 0.25
      max_open_positions: 5
      max_drawdown_percent: 20.0
      min_sharpe_ratio: 1.0
      kelly_fraction: 0.25
      stop_loss_multiplier: 2.0
      risk_free_rate: 0.03
      mcp_servers:
        - name: "risk_analyzer"
          type: "http"
          url: "http://risk-analyzer-server.cryptofunk.svc.cluster.local:8092/mcp"
        - name: "order_executor"
          type: "http"
          url: "http://order-executor-server.cryptofunk.svc.cluster.local:8091/mcp"
      step_interval: "10s"
      config:
        max_portfolio_exposure: 0.8
        max_position_size: 0.1
        max_positions: 3
        max_correlation: 0.7
        max_daily_loss: 0.02
        max_drawdown: 0.1
        min_sharpe_ratio: 1.0
        max_var_95: 0.05
        veto_power: true
        min_strategy_confidence: 0.70
        min_consensus_votes: 2
        max_leverage: 1.0
        circuit_breakers:
          enabled: true
          max_trades_per_hour: 10
          max_losses_per_day: 3
          volatility_threshold: 0.5
          drawdown_halt: 0.08
        kelly_fraction: 0.25
        min_position_usd: 10.0
        max_position_usd: 1000.0

    orchestration:
      voting:
        enabled: true
        method: "weighted_consensus"
        min_votes: 2
        quorum: 0.6
      llm_reasoning:
        enabled: true
        model: "claude-sonnet-4-20250514"
        max_tokens: 2000
        temperature: 0.7
        prompt_template: "templates/agent_decision.txt"
      coordination:
        broadcast_signals: true
        signal_expiry: "5m"
        enable_learning: false
      performance:
        track_agent_accuracy: true
        adjust_weights: false
        min_sample_size: 50

    communication:
      nats:
        topics:
          technical_signals: "agents.analysis.technical"
          orderbook_signals: "agents.analysis.orderbook"
          sentiment_signals: "agents.analysis.sentiment"
          trend_signals: "agents.strategy.trend"
          strategy_decisions: "agents.strategy.decisions"
          polymarket_signals: "agents.strategy.polymarket"
          trade_proposals: "agents.strategy.proposals"
          risk_approvals: "agents.risk.approvals"
          risk_vetoes: "agents.risk.vetoes"
          agent_heartbeat: "agents.system.heartbeat"
          agent_errors: "agents.system.errors"
        retention:
          signals: "1h"
          decisions: "24h"
          heartbeat: "5m"

    logging:
      level: "info"
      format: "json"
      output: "stderr"
      agent_levels:
        technical-agent: "debug"
        risk-agent: "info"
        trend-agent: "info"
