apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: cryptofunk
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: messaging
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 4222
          name: client
          protocol: TCP
        - containerPort: 8222
          name: monitoring
          protocol: TCP
        - containerPort: 6222
          name: cluster
          protocol: TCP
        command: ["nats-server", "-js", "-m", "8222"]
        volumeMounts:
        - name: nats-data
          mountPath: /data/jetstream
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
      - name: nats-exporter
        image: natsio/prometheus-nats-exporter:0.15.0
        imagePullPolicy: IfNotPresent
        args:
          - "-varz"
          - "-connz"
          - "-subsz"
          - "http://localhost:8222"
        ports:
        - name: metrics
          containerPort: 7777
          protocol: TCP
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 7777
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 7777
          initialDelaySeconds: 5
          periodSeconds: 30
      volumes:
      - name: nats-data
        persistentVolumeClaim:
          claimName: nats-data-pvc
