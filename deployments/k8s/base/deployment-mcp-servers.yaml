# MCP Servers Deployments
# MCP servers expose Streamable HTTP transport on dedicated ports:
#   market-data: 8090 | order-executor: 8091 | risk-analyzer: 8092 | technical-indicators: 8093 | polymarket: 8094

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-server
  namespace: cryptofunk
  labels:
    app.kubernetes.io/name: market-data-server
    app.kubernetes.io/component: mcp-server
spec:
  # NOTE: Streamable HTTP sessions are stateful (keyed by Mcp-Session-Id). With
  # replicas > 1, enable sticky sessions (sessionAffinity: ClientIP on the Service)
  # so each client is routed to the same pod. Reduce to replicas: 1 for simplicity.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: market-data-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-data-server
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
      - name: market-data-server
        image: cryptofunk/market-data-server:v0.10.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: mcp-http
          containerPort: 8090
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: mcp-http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: mcp-http
          initialDelaySeconds: 10
          periodSeconds: 30
        envFrom:
        - configMapRef:
            name: cryptofunk-config
        env:
        # POSTGRES vars BEFORE DATABASE_URL (K8s $(VAR) substitution requires prior definition)
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cryptofunk-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: POSTGRES_DB
        - name: POSTGRES_SSLMODE
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: POSTGRES_SSLMODE
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSLMODE)"
        # REDIS vars BEFORE REDIS_URL
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: REDIS_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cryptofunk-secrets
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/$(REDIS_DB)"
        # NATS vars BEFORE NATS_URL
        - name: NATS_HOST
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: NATS_HOST
        - name: NATS_PORT
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: NATS_PORT
        - name: NATS_URL
          value: "nats://$(NATS_HOST):$(NATS_PORT)"
        - name: COINGECKO_API_KEY
          valueFrom:
            secretKeyRef:
              name: cryptofunk-secrets
              key: COINGECKO_API_KEY
              optional: true
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: LOG_LEVEL
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
