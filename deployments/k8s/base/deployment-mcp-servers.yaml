# Services expose each MCP server within the cluster
apiVersion: v1
kind: Service
metadata:
  name: market-data-server
  namespace: cryptofunk
  labels:
    app.kubernetes.io/name: market-data-server
    app.kubernetes.io/component: mcp-server
spec:
  # sessionAffinity: ClientIP ensures a client always lands on the same pod.
  # Required because Streamable HTTP sessions are stateful (Mcp-Session-Id).
  sessionAffinity: ClientIP
  selector:
    app.kubernetes.io/name: market-data-server
  ports:
  - name: mcp-http
    port: 8090
    targetPort: mcp-http
    protocol: TCP
