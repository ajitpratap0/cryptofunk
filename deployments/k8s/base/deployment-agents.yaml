  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # remove old pod first to avoid resource spikes
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arbitrage-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arbitrage-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: cryptofunk-trading-system
    spec:
      containers:
      - name: arbitrage-agent
        image: cryptofunk/arbitrage-agent:v0.10.0
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: metrics
          containerPort: 9107
          protocol: TCP
        envFrom:
        - configMapRef:
            name: cryptofunk-config
        env:
        # POSTGRES vars BEFORE DATABASE_URL (K8s $(VAR) substitution requires prior definition)
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cryptofunk-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: POSTGRES_DB
        - name: POSTGRES_SSLMODE
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: POSTGRES_SSLMODE
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSLMODE)"
        # REDIS vars BEFORE REDIS_URL
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: REDIS_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cryptofunk-secrets
              key: REDIS_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/$(REDIS_DB)"
        # NATS vars BEFORE NATS_URL
        - name: NATS_HOST
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: NATS_HOST
        - name: NATS_PORT
          valueFrom:
            configMapKeyRef:
              name: cryptofunk-config
              key: NATS_PORT
        - name: NATS_URL
          value: "nats://$(NATS_HOST):$(NATS_PORT)"
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: cryptofunk-secrets
              key: LLM_API_KEY
        livenessProbe:
          exec:
            command:
            - pgrep
            - -x
            - agent
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - pgrep
            - -x
            - agent
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
