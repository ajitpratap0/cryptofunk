global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cryptofunk'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # CryptoFunk Orchestrator
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator-service.cryptofunk.svc.cluster.local:8081']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # CryptoFunk API Server
  - job_name: 'api'
    static_configs:
      - targets: ['api-service.cryptofunk.svc.cluster.local:80']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # MCP Servers (standalone HTTP services on ports 8090-8094)
  # Metrics require starting each server with --metrics-port <port>
  # Default metric ports: market-data=9110, order-executor=9111,
  #                       risk-analyzer=9112, technical-indicators=9113, polymarket=9114
  - job_name: 'mcp-servers'
    static_configs:
      - targets:
        - 'market-data-server.cryptofunk.svc.cluster.local:9110'       # market-data-server (--metrics-port 9110)
        - 'order-executor-server.cryptofunk.svc.cluster.local:9111'    # order-executor-server (--metrics-port 9111)
        - 'risk-analyzer-server.cryptofunk.svc.cluster.local:9112'     # risk-analyzer-server (--metrics-port 9112)
        - 'technical-indicators-server.cryptofunk.svc.cluster.local:9113'  # technical-indicators-server (--metrics-port 9113)
        - 'polymarket-server.cryptofunk.svc.cluster.local:9114'        # polymarket-server (--metrics-port 9114)
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Trading Agents (actual ports from agent logs)
  - job_name: 'agents'
    static_configs:
      - targets:
        - 'technical-agent.cryptofunk.svc.cluster.local:9101'   # technical-agent
        - 'trend-agent.cryptofunk.svc.cluster.local:9102'       # trend-agent
        - 'sentiment-agent.cryptofunk.svc.cluster.local:9104'   # sentiment-agent
        - 'orderbook-agent.cryptofunk.svc.cluster.local:9105'   # orderbook-agent
        - 'reversion-agent.cryptofunk.svc.cluster.local:9106'   # reversion-agent
        - 'arbitrage-agent.cryptofunk.svc.cluster.local:9107'   # arbitrage-agent
        - 'risk-agent.cryptofunk.svc.cluster.local:9108'        # risk-agent
        - 'polymarket-agent.cryptofunk.svc.cluster.local:9109'  # polymarket-agent
    metrics_path: '/metrics'
    scrape_interval: 15s

  # PostgreSQL exporter (if deployed)
  - job_name: 'postgres'
    static_configs:
      - targets: []  # Add postgres-exporter:9187 if deployed

  # Redis exporter (if deployed)
  - job_name: 'redis'
    static_configs:
      - targets: []  # Add redis-exporter:9121 if deployed

  # NATS server metrics
  # Requires prometheus-nats-exporter sidecar (https://github.com/nats-io/prometheus-nats-exporter)
  # NATS /varz returns JSON, NOT Prometheus exposition format — cannot scrape directly.
  # Deploy the exporter and uncomment:
  # - job_name: 'nats'
  #   static_configs:
  #     - targets: ['nats-exporter:7777']
