global:
  resolve_timeout: 5m
  # SMTP configuration for email alerts (configure before production deployment)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'cryptofunk-alerts@example.com'
  # smtp_auth_username: ''
  # smtp_auth_password: ''
  # smtp_require_tls: true

# Templates for alert formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route defines how alerts are grouped and sent to receivers
route:
  # Root route - all alerts start here
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s        # Wait 10s before sending first notification
  group_interval: 5m     # Wait 5m before sending batch of new alerts
  repeat_interval: 4h    # Repeat notification every 4h if not resolved

  # Child routes for specific alert types
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'default'
      group_wait: 0s
      repeat_interval: 1h

    # Circuit breaker alerts
    - match:
        alertname: CircuitBreakerOpen
      receiver: 'default'
      group_wait: 5s
      repeat_interval: 15m

    # Trading alerts - high priority
    - match_re:
        alertname: '(HighErrorRate|TradingSessionFailure|PositionLimitExceeded|MaxDrawdownExceeded)'
      receiver: 'default'
      group_wait: 5s
      repeat_interval: 30m

    # Agent health alerts
    - match_re:
        alertname: '(AgentDown|AgentHighLatency|AgentUnhealthy)'
      receiver: 'default'
      group_wait: 30s
      repeat_interval: 2h

    # System alerts (disk, memory, CPU)
    - match_re:
        alertname: '(HighMemoryUsage|HighCPUUsage|DiskSpaceWarning)'
      receiver: 'default'
      group_wait: 1m
      repeat_interval: 6h

# Inhibition rules - prevent duplicate notifications
inhibit_rules:
  # Inhibit warning if critical is firing for same alert
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Don't send agent alerts if orchestrator is down
  - source_match:
      alertname: 'OrchestratorDown'
    target_match_re:
      alertname: 'Agent.*'
    equal: ['cluster']

# Receivers define notification channels
receivers:
  - name: 'default'
    # IMPORTANT: No notification channels configured yet. Configure Slack webhook URL or SMTP before production deployment.
  - name: 'null'
