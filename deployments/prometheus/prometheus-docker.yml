global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cryptofunk'
    environment: 'local-docker'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  - "alerts/*.yml"

# Scrape configurations for docker-compose environment.
# Uses container service names (not K8s DNS names).
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # CryptoFunk Orchestrator (internal port 8080)
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # CryptoFunk API Server (internal port 8080)
  - job_name: 'api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # MCP Servers (metrics exposed via --metrics-port flag)
  # market-data=9110, order-executor=9111, risk-analyzer=9112,
  # technical-indicators=9113, polymarket=9114
  - job_name: 'mcp-servers'
    static_configs:
      - targets:
        - 'market-data-server:9110'
        - 'order-executor-server:9111'
        - 'risk-analyzer-server:9112'
        - 'technical-indicators-server:9113'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Trading Agents metrics ports (9101-9109)
  - job_name: 'agents'
    static_configs:
      - targets:
        - 'technical-agent:9101'
        - 'trend-agent:9102'
        - 'sentiment-agent:9104'
        - 'orderbook-agent:9105'
        - 'reversion-agent:9106'
        - 'risk-agent:9108'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # PostgreSQL exporter (if deployed)
  - job_name: 'postgres'
    static_configs:
      - targets: []  # Add postgres-exporter:9187 if deployed

  # Redis exporter (if deployed)
  - job_name: 'redis'
    static_configs:
      - targets: []  # Add redis-exporter:9121 if deployed

  # NATS server metrics via prometheus-nats-exporter sidecar
  - job_name: 'nats'
    static_configs:
      - targets: ['nats-exporter:7777']
    scrape_interval: 15s
